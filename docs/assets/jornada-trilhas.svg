<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">As 12 trilhas do Prisma.AI</title>
  <desc id="desc">Mapa visual com quatro atos e doze trilhas, do primeiro salário à proteção digital.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08070f"/>
      <stop offset="0.55" stop-color="#0d0b1c"/>
      <stop offset="1" stop-color="#12102a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6a4ff"/>
      <stop offset="0.38" stop-color="#6c3bff"/>
      <stop offset="0.72" stop-color="#2775ff"/>
      <stop offset="1" stop-color="#56ccf2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c3bff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#2775ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#08070f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#56ccf2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#08070f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="90" r="280" fill="url(#glow)"/>
  <circle cx="1180" cy="560" r="220" fill="url(#glowCyan)"/>

  <!-- wordmark -->
  <g transform="translate(64 42)">
    <path d="M10 0 22 27H-2L10 0Z" fill="url(#brand)"/>
    <text x="34" y="21" fill="#f7f4ff" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="-0.4">Prisma<tspan fill="#a890ff">.AI</tspan></text>
    <text x="1152" y="20" fill="#78728f" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" text-anchor="end">12 TRILHAS · UMA JORNADA</text>
  </g>

  <!-- headline -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#f7f4ff" font-size="34" font-weight="600" letter-spacing="-1.1">Doze trilhas. <tspan fill="url(#brand)">Uma evolução contínua.</tspan></text>
    <text x="64" y="147" fill="#a7a1bf" font-size="13.5">Do primeiro salário à proteção digital, cada trilha combina conceito, prática e evidência.</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4">
    <path d="M326 414h24"/>
    <path d="M624 414h24"/>
    <path d="M922 414h24"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.28">
    <path d="M348 410l7 4-7 4z"/>
    <path d="M646 410l7 4-7 4z"/>
    <path d="M944 410l7 4-7 4z"/>
  </g>

  <!-- ACT 1 -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="206" fill="#ff8a5c" font-size="9.5" font-weight="700" letter-spacing="2.2">ATO 01</text>
    <text x="64" y="232" fill="#f7f4ff" font-size="19" font-weight="600" letter-spacing="-0.4">Começar</text>
    <text x="64" y="251" fill="#78728f" font-size="11">Entender o dinheiro que chega.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="276" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="64" y="276" width="3" height="80" rx="1.5" fill="#ff8a5c" fill-opacity="0.9"/>
    <circle cx="88" cy="304" r="14" fill="#ff8a5c" fill-opacity="0.12" stroke="#ff8a5c" stroke-opacity="0.38"/>
    <text x="88" y="308" fill="#ffb08c" font-size="10.5" font-weight="700" text-anchor="middle">01</text>
    <text x="114" y="303" fill="#f7f4ff" font-size="14.5" font-weight="600">Meu primeiro salário</text>
    <text x="114" y="322" fill="#a7a1bf" font-size="11">Renda, descontos e líquido</text>

    <rect x="64" y="368" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="64" y="368" width="3" height="80" rx="1.5" fill="#ff8a5c" fill-opacity="0.9"/>
    <circle cx="88" cy="396" r="14" fill="#ff8a5c" fill-opacity="0.12" stroke="#ff8a5c" stroke-opacity="0.38"/>
    <text x="88" y="400" fill="#ffb08c" font-size="10.5" font-weight="700" text-anchor="middle">02</text>
    <text x="114" y="395" fill="#f7f4ff" font-size="14.5" font-weight="600">Orçamento na prática</text>
    <text x="114" y="414" fill="#a7a1bf" font-size="11">Prioridades e gastos invisíveis</text>

    <rect x="64" y="460" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="64" y="460" width="3" height="80" rx="1.5" fill="#ff8a5c" fill-opacity="0.9"/>
    <circle cx="88" cy="488" r="14" fill="#ff8a5c" fill-opacity="0.12" stroke="#ff8a5c" stroke-opacity="0.38"/>
    <text x="88" y="492" fill="#ffb08c" font-size="10.5" font-weight="700" text-anchor="middle">03</text>
    <text x="114" y="487" fill="#f7f4ff" font-size="14.5" font-weight="600">Pagamentos do dia a dia</text>
    <text x="114" y="506" fill="#a7a1bf" font-size="11">Pix, débito e crédito</text>
  </g>

  <!-- ACT 2 -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="362" y="206" fill="#56a8ff" font-size="9.5" font-weight="700" letter-spacing="2.2">ATO 02</text>
    <text x="362" y="232" fill="#f7f4ff" font-size="19" font-weight="600" letter-spacing="-0.4">Decidir</text>
    <text x="362" y="251" fill="#78728f" font-size="11">Fazer escolhas melhores.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="362" y="276" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="362" y="276" width="3" height="80" rx="1.5" fill="#56a8ff" fill-opacity="0.9"/>
    <circle cx="386" cy="304" r="14" fill="#56a8ff" fill-opacity="0.12" stroke="#56a8ff" stroke-opacity="0.38"/>
    <text x="386" y="308" fill="#8cc4ff" font-size="10.5" font-weight="700" text-anchor="middle">04</text>
    <text x="412" y="303" fill="#f7f4ff" font-size="14.5" font-weight="600">Cartão e fatura</text>
    <text x="412" y="322" fill="#a7a1bf" font-size="11">Limite, ciclo e rotativo</text>

    <rect x="362" y="368" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="362" y="368" width="3" height="80" rx="1.5" fill="#56a8ff" fill-opacity="0.9"/>
    <circle cx="386" cy="396" r="14" fill="#56a8ff" fill-opacity="0.12" stroke="#56a8ff" stroke-opacity="0.38"/>
    <text x="386" y="400" fill="#8cc4ff" font-size="10.5" font-weight="700" text-anchor="middle">05</text>
    <text x="412" y="395" fill="#f7f4ff" font-size="14.5" font-weight="600">Metas e reserva</text>
    <text x="412" y="414" fill="#a7a1bf" font-size="11">Objetivos e imprevistos</text>

    <rect x="362" y="460" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="362" y="460" width="3" height="80" rx="1.5" fill="#56a8ff" fill-opacity="0.9"/>
    <circle cx="386" cy="488" r="14" fill="#56a8ff" fill-opacity="0.12" stroke="#56a8ff" stroke-opacity="0.38"/>
    <text x="386" y="492" fill="#8cc4ff" font-size="10.5" font-weight="700" text-anchor="middle">06</text>
    <text x="412" y="483" fill="#f7f4ff" font-size="14.5" font-weight="600">Guardar sem perder</text>
    <text x="412" y="500" fill="#f7f4ff" font-size="14.5" font-weight="600">o controle</text>
    <text x="412" y="522" fill="#a7a1bf" font-size="11">Constância e método</text>
  </g>

  <!-- ACT 3 -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="660" y="206" fill="#38ef9d" font-size="9.5" font-weight="700" letter-spacing="2.2">ATO 03</text>
    <text x="660" y="232" fill="#f7f4ff" font-size="19" font-weight="600" letter-spacing="-0.4">Entender</text>
    <text x="660" y="251" fill="#78728f" font-size="11">Ler o custo do tempo.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="660" y="276" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="660" y="276" width="3" height="80" rx="1.5" fill="#38ef9d" fill-opacity="0.88"/>
    <circle cx="684" cy="304" r="14" fill="#38ef9d" fill-opacity="0.1" stroke="#38ef9d" stroke-opacity="0.34"/>
    <text x="684" y="308" fill="#7cf5bd" font-size="10.5" font-weight="700" text-anchor="middle">07</text>
    <text x="710" y="303" fill="#f7f4ff" font-size="14.5" font-weight="600">Juros e parcelas</text>
    <text x="710" y="322" fill="#a7a1bf" font-size="11">Custo real das escolhas</text>

    <rect x="660" y="368" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="660" y="368" width="3" height="80" rx="1.5" fill="#38ef9d" fill-opacity="0.88"/>
    <circle cx="684" cy="396" r="14" fill="#38ef9d" fill-opacity="0.1" stroke="#38ef9d" stroke-opacity="0.34"/>
    <text x="684" y="400" fill="#7cf5bd" font-size="10.5" font-weight="700" text-anchor="middle">08</text>
    <text x="710" y="395" fill="#f7f4ff" font-size="14.5" font-weight="600">Dívida que cresce</text>
    <text x="710" y="414" fill="#a7a1bf" font-size="11">Rotativo e saída</text>

    <rect x="660" y="460" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="660" y="460" width="3" height="80" rx="1.5" fill="#38ef9d" fill-opacity="0.88"/>
    <circle cx="684" cy="488" r="14" fill="#38ef9d" fill-opacity="0.1" stroke="#38ef9d" stroke-opacity="0.34"/>
    <text x="684" y="492" fill="#7cf5bd" font-size="10.5" font-weight="700" text-anchor="middle">09</text>
    <text x="710" y="487" fill="#f7f4ff" font-size="14.5" font-weight="600">Inflação e poder de compra</text>
    <text x="710" y="506" fill="#a7a1bf" font-size="11">Rendimento real</text>
  </g>

  <!-- ACT 4 -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="958" y="206" fill="#b6a4ff" font-size="9.5" font-weight="700" letter-spacing="2.2">ATO 04</text>
    <text x="958" y="232" fill="#f7f4ff" font-size="19" font-weight="600" letter-spacing="-0.4">Crescer e proteger</text>
    <text x="958" y="251" fill="#78728f" font-size="11">Cuidar do que você construiu.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="958" y="276" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="958" y="276" width="3" height="80" rx="1.5" fill="#b6a4ff" fill-opacity="0.88"/>
    <circle cx="982" cy="304" r="14" fill="#b6a4ff" fill-opacity="0.12" stroke="#b6a4ff" stroke-opacity="0.36"/>
    <text x="982" y="308" fill="#d3c8ff" font-size="10.5" font-weight="700" text-anchor="middle">10</text>
    <text x="1008" y="303" fill="#f7f4ff" font-size="14.5" font-weight="600">Onde o dinheiro rende</text>
    <text x="1008" y="322" fill="#a7a1bf" font-size="11">Risco, prazo e liquidez</text>

    <rect x="958" y="368" width="258" height="80" rx="14" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="958" y="368" width="3" height="80" rx="1.5" fill="#b6a4ff" fill-opacity="0.88"/>
    <circle cx="982" cy="396" r="14" fill="#b6a4ff" fill-opacity="0.12" stroke="#b6a4ff" stroke-opacity="0.36"/>
    <text x="982" y="400" fill="#d3c8ff" font-size="10.5" font-weight="700" text-anchor="middle">11</text>
    <text x="1008" y="395" fill="#f7f4ff" font-size="14.5" font-weight="600">Golpes e proteção de dados</text>
    <text x="1008" y="414" fill="#a7a1bf" font-size="11">Sinais de fraude e o que fazer</text>

    <rect x="958" y="460" width="258" height="80" rx="14" fill="#6c3bff" fill-opacity="0.12" stroke="#b6a4ff" stroke-opacity="0.32"/>
    <rect x="958" y="460" width="3" height="80" rx="1.5" fill="#b6a4ff" fill-opacity="0.95"/>
    <circle cx="982" cy="488" r="14" fill="#b6a4ff" fill-opacity="0.2" stroke="#b6a4ff" stroke-opacity="0.5"/>
    <text x="982" y="492" fill="#e2dbff" font-size="10.5" font-weight="700" text-anchor="middle">12</text>
    <text x="1008" y="487" fill="#f7f4ff" font-size="14.5" font-weight="600">Desafio integrador</text>
    <text x="1008" y="506" fill="#c9c1e8" font-size="11">Todas as competências</text>
  </g>

  <!-- footer -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <line x1="64" y1="584" x2="1152" y2="584" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="64" y="612" fill="#78728f" font-size="10.5" letter-spacing="0.2">Aprender fazendo · feedback contextual · progresso por competências</text>
    <text x="1152" y="612" fill="#78728f" font-size="10.5" text-anchor="end" letter-spacing="1.4">PRISMA.AI</text>
  </g>
</svg>
