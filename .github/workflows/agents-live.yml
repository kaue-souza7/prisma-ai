name: Agents live contract

on:
  workflow_dispatch:

jobs:
  live-contract:
    if: ${{ secrets.ORCHESTRATE_API_KEY != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
      ORCHESTRATE_ENABLED: "true"
      ORCHESTRATE_LIVE_TEST: "1"
      ORCHESTRATE_URL: ${{ secrets.ORCHESTRATE_URL }}
      ORCHESTRATE_API_KEY: ${{ secrets.ORCHESTRATE_API_KEY }}
      ORCHESTRATE_AGENT_MENTOR_ID: ${{ secrets.ORCHESTRATE_AGENT_MENTOR_ID }}
      ORCHESTRATE_CATALYST_AGENT_ID: ${{ secrets.ORCHESTRATE_CATALYST_AGENT_ID }}
      ORCHESTRATE_ANALYST_AGENT_ID: ${{ secrets.ORCHESTRATE_ANALYST_AGENT_ID }}
      ORCHESTRATE_STUDIO_AGENT_ID: ${{ secrets.ORCHESTRATE_STUDIO_AGENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run live agent contract
        run: pytest tests/test_orchestrate_live.py -q
